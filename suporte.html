<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Solucionar problema · Assistente de Agenda</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e3e6ec; --brand: #1f6f5c; --bad: #c0392b; --ok: #1f8a4c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 14px; }
  dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0 0 18px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  button { border: 0; background: var(--brand); color: #fff; padding: 12px 18px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; width: 100%; }
  button:disabled { opacity: .55; cursor: default; }
  .muted { color: var(--muted); font-size: 13px; }
  .erro { color: var(--bad); margin-top: 12px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef0f4; color: var(--muted); }
</style>
</head>
<body>
<main><div class="card" id="conteudo"><p class="muted">Carregando…</p></div>
<p class="muted" style="text-align:center;margin-top:14px"><a href="./">Abrir o painel</a></p></main>
<script>
(() => {
  const URL_FUNCAO = "https://vesskijhvnuuntlwdlze.supabase.co/functions/v1/whatsapp-webhook/suporte";
  const ir = window.__ir || ((u) => window.location.assign(u));
  const q = new URLSearchParams(window.location.search);
  const params = { i: q.get("i") || "", e: q.get("e") || "", s: q.get("s") || "" };
  const alvo = document.getElementById("conteudo");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const quando = (iso) => new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", dateStyle: "short", timeStyle: "short" });

  function erro(msg) { alvo.innerHTML = `<h1>Solucionar problema</h1><p class="erro">${esc(msg)}</p>`; }

  function mostrar(r) {
    const temSessao = !!r.sessao_url;
    alvo.innerHTML = `<h1>Solucionar problema · ${esc(r.cliente)}</h1>
      <dl>
        <dt>Cliente</dt><dd>${esc(r.cliente)}</dd>
        <dt>Incidente</dt><dd>#${esc(r.id)} <span class="chip">${esc(r.status)}</span></dd>
        <dt>Situação</dt><dd>${r.tipo === "voltou" ? "Erro que tinha sido resolvido e voltou" : "Erro novo"}</dd>
        <dt>Etapa</dt><dd>${esc(r.etapa)}</dd>
        <dt>Ocorrências</dt><dd>${esc(r.ocorrencias)} · última ${esc(quando(r.ultimo_em))}</dd>
        <dt>Resumo</dt><dd>${esc(r.exemplo)}</dd>
      </dl>
      <button id="iniciar">${temSessao ? "Abrir sessão de suporte" : "Iniciar suporte"}</button>
      <p class="muted">${temSessao ? "Já existe uma sessão do Claude para este incidente." :
        "O Claude vai investigar, registrar o caso na base de suporte e propor a correção. Nada muda em produção sem o seu ok."}</p>
      <p class="erro" id="msg"></p>`;
    const b = document.getElementById("iniciar");
    b.onclick = async () => {
      if (temSessao) return ir(r.sessao_url);
      if (b.disabled) return;
      b.disabled = true; b.textContent = "Abrindo a sessão do Claude…";
      document.getElementById("msg").textContent = "";
      try {
        const res = await fetch(URL_FUNCAO, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(params) });
        const j = await res.json().catch(() => ({}));
        if (res.ok && j.ok && j.url) return ir(j.url);
        throw new Error(j.erro || "Não consegui abrir a sessão agora.");
      } catch (e) {
        document.getElementById("msg").textContent = e.message;
        b.disabled = false; b.textContent = "Tentar de novo";
      }
    };
  }

  (async () => {
    if (!params.i || !params.e || !params.s) return erro("Link incompleto. Use o botão do e-mail de alerta.");
    try {
      const res = await fetch(`${URL_FUNCAO}?i=${encodeURIComponent(params.i)}&e=${encodeURIComponent(params.e)}&s=${encodeURIComponent(params.s)}`);
      const j = await res.json().catch(() => ({}));
      if (!res.ok || !j.ok) return erro(j.erro || "Não consegui carregar o incidente.");
      mostrar(j.resumo);
    } catch { erro("Não consegui falar com o servidor. Tente de novo em instantes."); }
  })();
})();
</script>
</body>
</html>
